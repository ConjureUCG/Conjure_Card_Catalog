<style>
/* ═══════════════════════════════════════════════════════════════════════════
   THE FRONT DOOR FOR playconjure.com
   ═══════════════════════════════════════════════════════════════════════════
   Not the app. The app is card_catalog.html, about 15 MB, and this page's job
   is to be the thing that loads instead of it - Pages allows a soft 100 GB a
   month, which at 15 MB is roughly 6,500 loads counting every crawler and link
   preview, so only a deliberate click should cost that.

   Every colour, ramp and font stack here is lifted from src/catalog.css so the
   page and the app are one object. Nothing is fetched from anywhere: no Google
   Fonts, no CDN, no analytics, no script tag.
   ═══════════════════════════════════════════════════════════════════════════ */

/* The angle the hover ring turns through. Registered so it can be ANIMATED -
   a plain custom property is a string as far as the animation engine is
   concerned and would jump from 0 to 360 with nothing in between. Where
   @property is unsupported the ring simply sits still, which is a fallback and
   not a break. */
@property --ang{ syntax:'<angle>'; inherits:false; initial-value:0deg }

:root{
  --bg:#0c0e14; --s1:#13161f; --s2:#1a1e2b;
  --b1:#2a2f45; --b2:#363d58;
  --go:#c9a84c; --g2:#e8c96a; --gd:#7a6030;
  --tx:#f0ead8; --td:#c0b89a; --tm:#7a7060;
  --ac:#7b9cda;
  --disp:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Crimson Pro',Georgia,'Times New Roman',serif;

  /* ── THE THREE LIVERIES, COPIED OUT OF THE APP ──────────────────────────
     gold   = catalog.css .tabs::after / .hdr-online
     lunar  = catalog.css :root --hdr-metal  (the Main side of the switch)
     fiery  = catalog.css body.rebirth --hdr-metal  (the Rebirth side)
     Written out rather than read from --hdr-metal, for the reason the header
     buttons are: that variable is redefined by body.rebirth, body.light and
     body.light.rebirth, and a value read from it would be four values. */
  --gold-ramp:linear-gradient(180deg,#4a3818 0%,#7a6030 15%,#f5ecd0 40%,
    #e8c96a 50%,#c9a84c 60%,#7a6030 85%,#4a3818 100%);
  --lunar-ramp:linear-gradient(180deg,#101c33 0%,#2b4a7a 15%,#e8f4ff 40%,
    #9ec8f0 50%,#5b86c4 60%,#2b4a7a 85%,#101c33 100%);
  --fiery-ramp:linear-gradient(180deg,#3a0a04 0%,#7d1c0c 15%,#ffe8b8 40%,
    #ffc02e 50%,#e07018 60%,#7d1c0c 85%,#3a0a04 100%);

  /* The same three as a ring, each ramp laid twice around the circle so a
     turn reads as a sheen travelling round rather than one slow sweep. */
  --gold-ring:conic-gradient(from var(--ang),
    #4a3818 0deg,#7a6030 27deg,#f5ecd0 72deg,#e8c96a 90deg,#c9a84c 108deg,
    #7a6030 153deg,#4a3818 180deg,#7a6030 207deg,#f5ecd0 252deg,
    #e8c96a 270deg,#c9a84c 288deg,#7a6030 333deg,#4a3818 360deg);
  --lunar-ring:conic-gradient(from var(--ang),
    #101c33 0deg,#2b4a7a 27deg,#e8f4ff 72deg,#9ec8f0 90deg,#5b86c4 108deg,
    #2b4a7a 153deg,#101c33 180deg,#2b4a7a 207deg,#e8f4ff 252deg,
    #9ec8f0 270deg,#5b86c4 288deg,#2b4a7a 333deg,#101c33 360deg);
  --fiery-ring:conic-gradient(from var(--ang),
    #3a0a04 0deg,#7d1c0c 27deg,#ffe8b8 72deg,#ffc02e 90deg,#e07018 108deg,
    #7d1c0c 153deg,#3a0a04 180deg,#7d1c0c 207deg,#ffe8b8 252deg,
    #ffc02e 270deg,#e07018 288deg,#7d1c0c 333deg,#3a0a04 360deg);

  /* The label gradients the live side of the app's switch paints through its
     glyphs: catalog.css --rb-lunar / --rb-fiery. */
  --lbl-lunar:linear-gradient(180deg,#2f6fd0 0%,#9aa6ff 20%,#e8f4ff 46%,
    #7fd4ff 62%,#2f6fd0 100%);
  --lbl-fiery:linear-gradient(180deg,#c2160c 0%,#f4471d 20%,#ff8a1f 42%,
    #ffe36b 52%,#ffc02e 68%,#c2160c 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--body); font-size:17px; line-height:1.5;
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:44px 16px; text-align:center;
  /* overflow-x:clip because the rule below is 100vw inside a padded body, the
     same reason catalog.css carries it. */
  overflow-x:clip;
  background-image:
    radial-gradient(120% 90% at 50% -10%, rgba(232,201,106,.075), transparent 62%),
    radial-gradient(90% 70% at 50% 108%, rgba(123,156,218,.06), transparent 60%);
  background-attachment:fixed;
}
main{width:100%; max-width:600px}

/* ── the wordmark ────────────────────────────────────────────────────────── */
.mark{
  display:block; width:min(350px,84vw); height:auto; margin:0 auto 20px;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.6));
}

/* ── the seven ───────────────────────────────────────────────────────────── */
.orbs{
  display:flex; justify-content:center; align-items:center;
  gap:clamp(7px,2.2vw,14px); margin:0 0 16px;
}
.orbs img{
  width:clamp(26px,6.4vw,36px); height:auto; display:block;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.55));
}

h1{
  font-family:var(--disp); font-weight:700;
  font-size:clamp(.72rem,2.5vw,.92rem); letter-spacing:.22em;
  text-transform:uppercase; color:var(--td);
  margin-bottom:20px;
}

/* ── the bar, edge to edge ───────────────────────────────────────────────── */
/* The app's own 4px gold ramp, the one on header::after and .tabs::after, and
   it crosses the whole window rather than stopping at the column. Broken out
   of the centred column with a 100vw width and a negative half-gutter. */
.rule{
  height:4px; width:100vw; margin:0 0 30px calc(50% - 50vw);
  background:var(--gold-ramp);
}

/* ── THE BUTTONS ─────────────────────────────────────────────────────────── */
/* One mechanism for all of them. The border is a gradient in the BORDER-BOX
   layer with a transparent border over it, rather than border-image: that is
   what lets the same element also carry an opaque padding-box fill, and what
   lets the ramp be swapped for a rotating conic on hover without the box
   moving by a pixel.
   ⚠ THE BUTTON DOES NOT MOVE, ONLY THE METAL DOES. No transform, no scale. */
.nav{display:grid; gap:16px}
.r2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.r3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}

.mbtn{
  display:flex; align-items:center; justify-content:center; gap:9px;
  font-family:var(--disp); font-weight:700; text-transform:uppercase;
  text-decoration:none; letter-spacing:.13em; text-align:center;
  border:2px solid transparent;
  background:var(--fill) padding-box, var(--ramp) border-box;
  color:var(--ink);
  transition:box-shadow .18s, filter .18s;
}
.mbtn:hover,.mbtn:focus-visible{
  background:var(--fill-hi) padding-box, var(--ring) border-box;
  animation:turn 2.6s linear infinite;
  box-shadow:0 0 12px var(--glow);
}
.mbtn:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.mbtn svg{flex:0 0 auto; width:1.15em; height:1.15em}
@keyframes turn{ to{ --ang:360deg } }
@media (prefers-reduced-motion:reduce){
  .mbtn:hover,.mbtn:focus-visible{animation:none}
}

/* large - the two games */
.big{
  padding:20px 14px; font-size:clamp(1.05rem,3.4vw,1.35rem); letter-spacing:.16em;
}
/* the live label of the app's switch, painted through the glyphs */
.big span{
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  background-image:var(--lbl);
}
/* small - everything else */
.sm{padding:11px 10px; font-size:clamp(.72rem,2.3vw,.86rem)}
/* The two rules buttons are narrower than the game buttons above them, so the
   pair reads as subordinate to that pair rather than as a second row of equals. */
.narrow{width:85%; justify-self:center}

/* MAIN - catalog.css :root --hdr-metal, --hdr-fill, --hdr-ink, --hdr-glow */
.b-main{
  --ramp:var(--lunar-ramp); --ring:var(--lunar-ring); --lbl:var(--lbl-lunar);
  --ink:#cfe2ff; --glow:rgba(120,170,235,.32);
  --fill:linear-gradient(180deg,rgba(46,92,160,.34) 0%,rgba(20,38,70,.30) 100%),
         linear-gradient(#0c0e14,#0c0e14);
  --fill-hi:linear-gradient(180deg,rgba(66,120,200,.46) 0%,rgba(28,52,94,.40) 100%),
            linear-gradient(#0c0e14,#0c0e14);
}
/* REBIRTH - catalog.css body.rebirth, same four */
.b-rb{
  --ramp:var(--fiery-ramp); --ring:var(--fiery-ring); --lbl:var(--lbl-fiery);
  --ink:#ffd9a8; --glow:rgba(255,140,40,.32);
  --fill:linear-gradient(180deg,rgba(176,58,16,.34) 0%,rgba(70,20,10,.30) 100%),
         linear-gradient(#0c0e14,#0c0e14);
  --fill-hi:linear-gradient(180deg,rgba(210,74,20,.46) 0%,rgba(96,28,14,.40) 100%),
            linear-gradient(#0c0e14,#0c0e14);
}
/* the app's ordinary gold button */
.b-gold{
  --ramp:var(--gold-ramp); --ring:var(--gold-ring);
  --ink:#f0ead8; --glow:rgba(232,201,106,.30);
  --fill:linear-gradient(#1a1e2b,#13161f);
  --fill-hi:linear-gradient(#242938,#1a1e2b);
}
/* PLAY ONLINE - catalog.css .hdr-online, which is deliberately NOT themed */
.b-online{
  --ramp:var(--gold-ramp); --ring:var(--gold-ring);
  --ink:#e8c96a; --glow:rgba(232,201,106,.38);
  --fill:linear-gradient(#0a0b0f,#0a0b0f);
  --fill-hi:linear-gradient(#15171f,#15171f);
}
.b-online:hover,.b-online:focus-visible{--ink:#fff6d8}

footer{
  margin-top:34px; font-size:.8rem; color:var(--tm);
}
footer a{color:var(--ac); text-decoration:none; border-bottom:1px solid transparent}
footer a:hover,footer a:focus-visible{border-bottom-color:currentColor}
footer .sep{opacity:.45; margin:0 8px}

@media (max-width:430px){
  body{padding:30px 14px}
  .r3{grid-template-columns:1fr}
  .narrow{width:100%}
}
</style>
</head>
