    <div id='pane-testdeck' style='display:none'>
      <!-- Board tokens must not use the .cg / .ci grid classes: the editor's face pass and the grid's tilt handler would take them. -->
      <!-- Four hosts laid into one row by display:contents. The table's heartbeat redraws all but #tdBar, so its Save / Load list stays open. -->
      <div class='td-table' id='tdTable'><span class='td-th' id='tdTblLeft'></span><span class='tbl-gap'></span><span class='td-th' id='tdTblTools'></span><span class='td-th' id='tdBar'></span><span class='td-th' id='tdTblEnd'></span></div>
      <div class='td-top' id='tdTop'>
        <div class='td-toprow'>
          <div class='td-counters' id='tdCounters'></div>
        </div>
      </div>
      <div class='td-withfeed'>
        <div class='td-board' id='tdBoard'></div>
      </div>
      <aside class='td-feed' id='tdFeed' role='dialog' aria-modal='false' aria-label='Record Log' hidden></aside>
    </div>
