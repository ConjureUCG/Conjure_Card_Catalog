/* Registered so it animates: an unregistered custom property would jump from 0 to 360. */
@property --ang{ syntax:'<angle>'; inherits:false; initial-value:0deg }

:root{
  --bg:#0c0e14; --s1:#13161f; --s2:#1a1e2b;
  --b1:#2a2f45; --b2:#363d58;
  --go:#c9a84c; --g2:#e8c96a; --gd:#7a6030;
  --tx:#f0ead8; --td:#c0b89a; --tm:#7a7060;
  --ac:#7b9cda;
  --disp:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Crimson Pro',Georgia,'Times New Roman',serif;

  /* Copied from catalog.css (.tabs::after, --hdr-metal, body.rebirth --hdr-metal): this page shows both games' metal at once. */
  --gold-ramp:linear-gradient(180deg,#4a3818 0%,#7a6030 15%,#f5ecd0 40%,
    #e8c96a 50%,#c9a84c 60%,#7a6030 85%,#4a3818 100%);
  --lunar-ramp:linear-gradient(180deg,#101c33 0%,#2b4a7a 15%,#e8f4ff 40%,
    #9ec8f0 50%,#5b86c4 60%,#2b4a7a 85%,#101c33 100%);
  --fiery-ramp:linear-gradient(180deg,#3a0a04 0%,#7d1c0c 15%,#ffe8b8 40%,
    #ffc02e 50%,#e07018 60%,#7d1c0c 85%,#3a0a04 100%);

  --gold-ring:conic-gradient(from var(--ang),
    #4a3818 0deg,#7a6030 27deg,#f5ecd0 72deg,#e8c96a 90deg,#c9a84c 108deg,
    #7a6030 153deg,#4a3818 180deg,#7a6030 207deg,#f5ecd0 252deg,
    #e8c96a 270deg,#c9a84c 288deg,#7a6030 333deg,#4a3818 360deg);
  --lunar-ring:conic-gradient(from var(--ang),
    #101c33 0deg,#2b4a7a 27deg,#e8f4ff 72deg,#9ec8f0 90deg,#5b86c4 108deg,
    #2b4a7a 153deg,#101c33 180deg,#2b4a7a 207deg,#e8f4ff 252deg,
    #9ec8f0 270deg,#5b86c4 288deg,#2b4a7a 333deg,#101c33 360deg);
  --fiery-ring:conic-gradient(from var(--ang),
    #3a0a04 0deg,#7d1c0c 27deg,#ffe8b8 72deg,#ffc02e 90deg,#e07018 108deg,
    #7d1c0c 153deg,#3a0a04 180deg,#7d1c0c 207deg,#ffe8b8 252deg,
    #ffc02e 270deg,#e07018 288deg,#7d1c0c 333deg,#3a0a04 360deg);

  --lbl-lunar:linear-gradient(180deg,#2f6fd0 0%,#9aa6ff 20%,#e8f4ff 46%,
    #7fd4ff 62%,#2f6fd0 100%);
  --lbl-fiery:linear-gradient(180deg,#c2160c 0%,#f4471d 20%,#ff8a1f 42%,
    #ffe36b 52%,#ffc02e 68%,#c2160c 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--body); font-size:17px; line-height:1.5;
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:44px 16px; text-align:center;
  /* clip: the .rule below is 100vw inside a padded body. */
  overflow-x:clip;
  background-image:
    radial-gradient(120% 90% at 50% -10%, rgba(232,201,106,.075), transparent 62%),
    radial-gradient(90% 70% at 50% 108%, rgba(123,156,218,.06), transparent 60%);
  background-attachment:fixed;
}
main{width:100%; max-width:690px}

.mark{
  display:block; width:min(350px,84vw); height:auto; margin:0 auto 20px;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.6));
}

.orbs{
  display:flex; justify-content:center; align-items:center;
  gap:clamp(7px,2.2vw,14px); margin:0 0 16px;
}
.orbs img{
  width:clamp(26px,6.4vw,36px); height:auto; display:block;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.55));
}

h1{
  font-family:var(--disp); font-weight:700;
  font-size:clamp(.72rem,2.5vw,.92rem); letter-spacing:.22em;
   color:var(--td);
  margin-bottom:20px;
}

.rule{
  height:4px; width:100vw; margin:0 0 30px calc(50% - 50vw);
  background:var(--gold-ramp);
}

/* A border-box gradient under a transparent border, not border-image: the fill stays opaque and hover swaps in the conic ring.
   The button never moves on hover, only the metal: no transform, no scale. */
.nav{display:grid; gap:16px}
.r2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.r4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}

.mbtn{
  display:flex; align-items:center; justify-content:center; gap:9px;
  font-family:var(--disp); font-weight:700; 
  text-decoration:none; letter-spacing:.13em; text-align:center;
  border:4px solid transparent;
  background:var(--fill) padding-box, var(--ramp) border-box;
  color:var(--ink);
  transition:box-shadow .18s, filter .18s;
}
.mbtn:hover,.mbtn:focus-visible{
  background:var(--fill-hi) padding-box, var(--ring) border-box;
  animation:turn 2.6s linear infinite;
  box-shadow:0 0 12px var(--glow);
}
.mbtn:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.mbtn svg{flex:0 0 auto; width:1.15em; height:1.15em}
@keyframes turn{ to{ --ang:360deg } }
@media (prefers-reduced-motion:reduce){
  .mbtn:hover,.mbtn:focus-visible{animation:none}
}

/* Three rows, the outer two 1fr, so the name stays in the middle of the button. */
.big{
  display:grid; grid-template-rows:1fr auto 1fr; justify-items:center; align-items:center; gap:.2em 0;
  padding:16px 14px; font-size:clamp(1.575rem,5.1vw,2.025rem); letter-spacing:.16em;
}
.big span{
  grid-row:2;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  background-image:var(--lbl);
}
.big .sub{
  grid-row:3; align-self:start; white-space:nowrap;
  font-family:var(--body); font-weight:400; font-size:clamp(.9rem,2.6vw,1.05rem);
  letter-spacing:.05em; line-height:1.2; color:var(--ink);
}
.sm{padding:11px 10px; font-size:clamp(.72rem,2.3vw,.86rem)}
.narrow{width:85%; justify-self:center}

.b-main{
  --ramp:var(--lunar-ramp); --ring:var(--lunar-ring); --lbl:var(--lbl-lunar);
  --ink:#cfe2ff; --glow:rgba(120,170,235,.32);
  --fill:linear-gradient(180deg,rgba(46,92,160,.34) 0%,rgba(20,38,70,.30) 100%),
         linear-gradient(#0c0e14,#0c0e14);
  --fill-hi:linear-gradient(180deg,rgba(66,120,200,.46) 0%,rgba(28,52,94,.40) 100%),
            linear-gradient(#0c0e14,#0c0e14);
}
.b-rb{
  --ramp:var(--fiery-ramp); --ring:var(--fiery-ring); --lbl:var(--lbl-fiery);
  --ink:#ffd9a8; --glow:rgba(255,140,40,.32);
  --fill:linear-gradient(180deg,rgba(176,58,16,.34) 0%,rgba(70,20,10,.30) 100%),
         linear-gradient(#0c0e14,#0c0e14);
  --fill-hi:linear-gradient(180deg,rgba(210,74,20,.46) 0%,rgba(96,28,14,.40) 100%),
            linear-gradient(#0c0e14,#0c0e14);
}
.b-gold{
  --ramp:var(--gold-ramp); --ring:var(--gold-ring);
  --ink:#f0ead8; --glow:rgba(232,201,106,.30);
  --fill:linear-gradient(#1a1e2b,#13161f);
  --fill-hi:linear-gradient(#242938,#1a1e2b);
}
.b-online{

<script>
(function(){
  var cv = document.querySelector('.sparks');
  if(!cv || !cv.getContext) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cx = cv.getContext('2d');
  var W = 0, H = 0;
  function size(){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  addEventListener('resize', size);

  function dot(rgb){
    var s = document.createElement('canvas'); s.width = s.height = 32;
    var g = s.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(' + rgb + ',1)');
    gr.addColorStop(.28, 'rgba(' + rgb + ',.8)');
    gr.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    return s;
  }
  /* Black added to anything is nothing, so a dark speck gets a solid core and ordinary blending. */
  function speck(){
    var s = document.createElement('canvas'); s.width = s.height = 32;
    var g = s.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.45, 'rgba(0,0,0,.9)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    return s;
  }
  var SIDE = {
    main: {edge:0, dir:1, hot:0, want:0, acc:0,
           dots:[dot('175,228,255'), dot('140,205,255'), dot('214,255,232'), dot('190,250,214')],
           odd:dot('255,255,255'), oddDark:false},
    rb:   {edge:1, dir:-1, hot:0, want:0, acc:0,
           dots:[dot('255,72,44'), dot('255,120,40'), dot('255,214,72'), dot('255,236,140')],
           odd:speck(), oddDark:true}
  };
  var GOLD = {hot:0, want:0, acc:0, el:document.querySelector('.b-online'),
              dots:[dot('232,201,106'), dot('245,236,208'), dot('201,168,76'), dot('255,241,184')]};
  var P = [], MAX = 900;
  function spawn(k){
    var s = SIDE[k], hot = s.hot;
    var bvx = s.dir * (0.25 + Math.random() * 0.75) * (1 + hot * 0.9);
    var bvy = (Math.random() - 0.5) * 0.35 - 0.12;
    var odd = Math.random() < 1 / 9;
    P.push({k:k, x:(s.edge ? W : 0) + s.dir * (Math.random() * W * 0.05 - 6),
            y:Math.random() * H, vx:bvx, vy:bvy, bvx:bvx, bvy:bvy,
            life:0, max:240 + Math.random() * 280,
            r:(0.6 + Math.random() * 1.3 + hot * 0.4) * (odd && s.oddDark ? 1.25 : 1),
            img:odd ? s.odd : s.dots[(Math.random() * s.dots.length) | 0],
            dark:odd && s.oddDark,
            ph:Math.random() * 6.283});
  }
  function spawnGold(){
    var b = GOLD.el.getBoundingClientRect();
    var cx0 = b.left + b.width / 2, cy0 = b.top + b.height / 2;
    var ang = Math.random() * 6.283, sp = 0.6 + Math.random() * 1.6;
    var vx = Math.cos(ang) * sp * 1.6, vy = Math.sin(ang) * sp;
    P.push({k:'gold', x:cx0 + (Math.random() - 0.5) * b.width * 0.2,
            y:cy0 + (Math.random() - 0.5) * b.height * 0.3,
            vx:vx, vy:vy, bvx:vx * 0.6, bvy:vy * 0.6,
            life:0, max:80 + Math.random() * 90,
            r:0.6 + Math.random() * 1.4,
            img:GOLD.dots[(Math.random() * GOLD.dots.length) | 0],
            ph:Math.random() * 6.283});
  }
  var M = {x:-1e4, y:-1e4, vx:0, vy:0, t:0};
  addEventListener('pointermove', function(ev){
    var now = performance.now();
    if(M.t){
      var dt = Math.max(8, now - M.t);
      M.vx = (ev.clientX - M.x) / dt * 16; M.vy = (ev.clientY - M.y) / dt * 16;
    }
    M.x = ev.clientX; M.y = ev.clientY; M.t = now;
  }, {passive:true});
  document.addEventListener('pointerleave', function(){ M.x = M.y = -1e4; M.t = 0; });

  function hover(sel, k){
    [].forEach.call(document.querySelectorAll(sel), function(el){
      var on = function(){ SIDE[k].want = 1; document.body.classList.add('hot-' + k); };
      var off = function(){ SIDE[k].want = 0; document.body.classList.remove('hot-' + k); };
      el.addEventListener('pointerenter', on); el.addEventListener('pointerleave', off);
      el.addEventListener('focus', on); el.addEventListener('blur', off);
    });
  }
  hover('.b-main', 'main');
  hover('.b-rb', 'rb');
  if(GOLD.el){
    var gOn = function(){ GOLD.want = 1; }, gOff = function(){ GOLD.want = 0; };
    GOLD.el.addEventListener('pointerenter', gOn); GOLD.el.addEventListener('pointerleave', gOff);
    GOLD.el.addEventListener('focus', gOn); GOLD.el.addEventListener('blur', gOff);
  }

  var R = 130, last = 0;
  function frame(t){
    var f = last ? Math.min(3, (t - last) / 16.667) : 1;
    last = t;
    M.vx *= Math.pow(0.86, f); M.vy *= Math.pow(0.86, f);
    for(var k in SIDE){
      var s = SIDE[k];
      s.hot += (s.want - s.hot) * Math.min(1, 0.07 * f);
      s.acc += (0.55 + s.hot * 1.6) * (H / 900) * f;
      while(s.acc >= 1 && P.length < MAX){ spawn(k); s.acc -= 1; }
      if(s.acc > 4) s.acc = 4;
    }
    GOLD.hot += (GOLD.want - GOLD.hot) * Math.min(1, 0.09 * f);
    if(GOLD.el && GOLD.hot > 0.02){
      GOLD.acc += GOLD.hot * 2.2 * f;
      while(GOLD.acc >= 1 && P.length < MAX + 200){ spawnGold(); GOLD.acc -= 1; }
    } else GOLD.acc = 0;
    cx.clearRect(0, 0, W, H);
    if(GOLD.el && GOLD.hot > 0.01){
      var gb = GOLD.el.getBoundingClientRect();
      var gx = gb.left + gb.width / 2, gy = gb.top + gb.height / 2;
      var gr0 = Math.max(gb.width * 0.5, 150) * (0.6 + GOLD.hot * 0.3);
      var gg = cx.createRadialGradient(gx, gy, 0, gx, gy, gr0);
      gg.addColorStop(0, 'rgba(245,226,150,' + (0.36 * GOLD.hot).toFixed(3) + ')');
      gg.addColorStop(0.4, 'rgba(232,201,106,' + (0.16 * GOLD.hot).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(201,168,76,0)');
      cx.globalCompositeOperation = 'lighter';
      cx.globalAlpha = 1;
      cx.fillStyle = gg;
      cx.save(); cx.translate(gx, gy); cx.scale(1.7, 1); cx.translate(-gx, -gy);
      cx.fillRect(gx - gr0, gy - gr0, gr0 * 2, gr0 * 2);
      cx.restore();
    }
    var mode = '';
    for(var i = P.length - 1; i >= 0; i--){
      var p = P[i], gold = p.k === 'gold', s = gold ? null : SIDE[p.k];
      p.life += f;
      var inset = gold ? 0 : (s.edge ? (W - p.x) / W : p.x / W);
      if(p.life >= p.max || inset > 0.62 || p.y < -20 || p.y > H + 20
         || p.x < -20 || p.x > W + 20){ P.splice(i, 1); continue; }
      var dx = p.x - M.x, dy = p.y - M.y, d2 = dx * dx + dy * dy;
      if(d2 < R * R){
        var d = Math.sqrt(d2) || 1, g = (1 - d / R);
        p.vx += (M.vx * 0.09 + dx / d * 0.45) * g * f;
        p.vy += (M.vy * 0.09 + dy / d * 0.45) * g * f;
      }
      p.vx += (p.bvx - p.vx) * 0.02 * f;
      p.vy += (p.bvy - p.vy) * 0.02 * f;
      p.x += p.vx * f;
      p.y += (p.vy + Math.sin(p.ph + p.life * 0.035) * 0.18) * f;
      var a = gold
        ? Math.min(1, p.life / 8) * Math.min(1, (p.max - p.life) / 60)
        : Math.min(1, p.life / 30) * Math.min(1, (p.max - p.life) / 90)
            * Math.max(0, 1 - inset / 0.62) * (0.5 + s.hot * 0.5) * (p.dark ? 0.8 : 1);
      if(a <= 0.01) continue;
      var want = p.dark ? 'source-over' : 'lighter';
      if(want !== mode){ cx.globalCompositeOperation = want; mode = want; }
      var sz = p.r * 2.6;
      cx.globalAlpha = a;
      cx.drawImage(p.img, p.x - sz, p.y - sz, sz * 2, sz * 2);
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
